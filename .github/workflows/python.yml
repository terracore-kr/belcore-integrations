name: Python
on:
  push:
    paths: ["python/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (versions already on PyPI are skipped)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "python/belcore[test]" -e "python/langchain-belcore[test]"
      - run: pytest -q python/belcore/tests python/langchain-belcore/tests

  publish-belcore:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: b
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('python/belcore/pyproject.toml','rb'))['project']['version'])")
          if curl -sf "https://pypi.org/pypi/belcore/$v/json" >/dev/null; then echo "belcore $v already on PyPI"; else pip install build && python -m build python/belcore --outdir dist && echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.b.outputs.go == 'yes'
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-langchain-belcore:
    needs: publish-belcore
    runs-on: ubuntu-latest
    environment: pypi-langchain
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: b
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('python/langchain-belcore/pyproject.toml','rb'))['project']['version'])")
          if curl -sf "https://pypi.org/pypi/langchain-belcore/$v/json" >/dev/null; then echo "langchain-belcore $v already on PyPI"; else pip install build && python -m build python/langchain-belcore --outdir dist && echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.b.outputs.go == 'yes'
        uses: pypa/gh-action-pypi-publish@release/v1
